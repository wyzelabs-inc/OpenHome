name: gemma_4_31b_it
backend: vllm
model: google/gemma-4-31b-it
input: frames
video_dir: videos_640
frames:
  fps: 1.0
  min_frames: 4
  max_frames: 64
  max_pixels: 230400
  jpeg_quality: 3
instruction: You are shown frames sampled from a home-security camera clip, in order, each preceded by its timestamp. Answer
  the multiple-choice question about the clip.
image_detail: low
answer: text
generation:
  temperature: 0
  max_tokens: 64
concurrency: 16
server:
  engine: vllm
  image: vllm/vllm-openai:v0.31.0
  tp: 2
  port: 8010
  args:
  - --dtype
  - bfloat16
  - --max-model-len
  - '65536'
  - --gpu-memory-utilization
  - '0.90'
  - --max-num-seqs
  - '32'
  - --limit-mm-per-prompt
  - '{"image":64}'
